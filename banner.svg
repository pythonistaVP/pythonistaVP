<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="pythonistaVP">
  <defs>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="40%" stop-color="#0a5c2e"/>
      <stop offset="75%" stop-color="#00c853"/>
      <stop offset="100%" stop-color="#39ff14"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/><feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#0c2a1a" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="240" fill="#000000"/>
  <rect width="1200" height="240" fill="url(#grid)" opacity="0.6"/>
  <ellipse cx="330" cy="150" rx="420" ry="170" fill="url(#halo)"/>

  <text x="90" y="80" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="18" fill="#1c8a4b">guest@github:~$ whoami</text>

  <text x="90" y="152" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="72" font-weight="700" fill="#39ff14" letter-spacing="1" filter="url(#glow)">pythonistaVP</text>

  <rect x="586" y="100" width="26" height="58" fill="#39ff14">
    <animate attributeName="opacity" values="1;1;1;0;0;1" dur="1.3s" repeatCount="indefinite"/>
  </rect>

  <text x="93" y="197" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#63d99a">browser extensions   /   bots   /   automation   /   cats</text>

  <text x="1110" y="152" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="22" fill="#1c8a4b">/\_/\</text>
  <text x="1110" y="176" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="22" fill="#1c8a4b">( o.o )</text>

  <rect x="0" y="236" width="1200" height="4" fill="url(#rule)"/>
</svg>